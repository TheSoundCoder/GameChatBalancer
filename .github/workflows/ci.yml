name: CI

on:
  push:
	branches:
	  - main
	  - Upgrade-WinUI
  pull_request:

jobs:
  build-and-test:
	runs-on: windows-latest

	steps:
	  - name: Checkout
		uses: actions/checkout@v4

	  - name: Setup .NET
		uses: actions/setup-dotnet@v4
		with:
		  dotnet-version: 10.0.x

	  - name: Restore
		run: dotnet restore AudioControl.sln

	  - name: Build
		run: dotnet build AudioControl.sln --configuration Release --no-restore

	  - name: Test
		run: dotnet test AudioControl.sln --configuration Release --no-build
